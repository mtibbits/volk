name: Check SIMD load alignment

on:
  push:
    paths:
      - 'kernels/volk/**'
      - 'tools/lint_simd_loadu_alignment.py'
      - '.github/workflows/check-simd-alignment.yml'
  pull_request:
    paths:
      - 'kernels/volk/**'
      - 'tools/lint_simd_loadu_alignment.py'
      - '.github/workflows/check-simd-alignment.yml'

jobs:
  lint:
    name: SIMD loadu-of-under-aligned-local-array lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run SIMD alignment lint
        run: python3 tools/lint_simd_loadu_alignment.py
