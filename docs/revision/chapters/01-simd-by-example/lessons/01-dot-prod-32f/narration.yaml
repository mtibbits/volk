segments:
  - text: This kernel is the dot product. Multiply two vectors element by element, add the products, return one number. In a FIR filter that number is one output sample.
    show: generic
  - text: The generic version is the definition. One multiply and one add per element, and every other version in this file has to match it to within rounding.
    show: generic-loop
  - text: SSE processes sixteen floats per trip. Four registers of four lanes each, multiplied pairwise, and added into four separate accumulators so the adds do not wait on each other.
    show: sse-lanes
  - text: After the loop, the accumulators are combined and their four lanes are added one by one. That is the horizontal reduction, and every SIMD version ends with one.
    show: sse-combine
  - text: Sixteen does not divide every length, so a scalar tail loop finishes the last few elements exactly as the generic version would.
    show: sse-tail
  - text: The SSE3 version is the SSE version with two operands swapped. It is a rung with nothing on it, kept so the dispatcher has an SSE3 entry.
    show: sse3-add
  - text: SSE4 point 1 adds a dot product instruction. Four calls, each writing its sum into a different lane and zeros elsewhere, then combined with a bitwise or instead of an add. Elegant, and usually slower.
    show: sse4-dp
  - text: AVX is SSE with registers twice as wide. Eight floats per register, still sixteen per trip, so two accumulators do the work of four. Same reduction, same tail.
    show: avx-lanes
  - text: AVX2 with FMA is the version most modern x86 machines run. One fused multiply add does both operations with a single rounding, and the arithmetic is one line.
    show: fma-step
  - text: Eight lanes are stored and summed, then the tail loop mops up.
    show: [fma-reduce, fma-tail]
  - text: AVX five twelve is the same code at sixteen lanes per instruction.
    show: avx512-step
  - text: On Arm, NEON keeps four accumulators and uses a multiply accumulate, then folds the lanes down in two steps. NEON version 8 swaps in a fused multiply add and a single across-vector sum.
    show: [neon-mla, neon-reduce]
  - text: At run time VOLK takes the highest-ranked variant this CPU supports, walking the tree from the top, unless a profile run has recorded a measured winner for this machine.
    diagram: dispatch
    node: u-avx2-fma
